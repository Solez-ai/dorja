name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate dummy .env (secrets plugin requires it)
        working-directory: dorja
        run: echo "# CI build" > .env

      - name: Generate dummy google-services.json
        working-directory: dorja/app
        run: |
          cat > google-services.json << 'ENDJSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dorja-placeholder",
              "storage_bucket": "dorja-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.dorja.app"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCiBuildOnly"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          ENDJSON

      - name: Decode keystore from GitHub secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > dorja/release.keystore

      - name: Build signed release APK
        working-directory: dorja
        run: |
          gradle assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/dorja/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=dorja \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorja-release-apk
          path: dorja/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
