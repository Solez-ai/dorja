name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate dummy .env
        working-directory: dorja
        run: echo "# CI build" > .env

      - name: Generate dummy google-services.json
        working-directory: dorja/app
        run: |
          printf '%s\n' '{
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dorja-placeholder",
              "storage_bucket": "dorja-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.dorja.app"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCiBuildOnly"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }' > google-services.json

      - name: Decode keystore from GitHub secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > dorja/release.keystore

      - name: Generate debug keystore
        working-directory: dorja
        run: |
          keytool -genkey -v -keystore debug.keystore -keyalgorithm RSA -keysize 2048 \
            -validity 10000 -alias androiddebugkey -keypass android -storepass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: dorja
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        working-directory: dorja
        continue-on-error: true
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/dorja/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: dorja
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorja-debug-apk
          path: dorja/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dorja-release-apk
          path: dorja/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: |
            dorja/app/build/outputs/apk/debug/app-debug.apk
            dorja/app/build/outputs/apk/release/*.apk
          body: |
            Latest development build from main.

            Install on any Android device running Android 7.0+.
            The debug APK works without signing keys.
