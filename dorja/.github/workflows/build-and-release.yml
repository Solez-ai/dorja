name: Build and Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate gradle wrapper
        run: gradle wrapper

      - name: Create google-services.json placeholder
        run: |
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dorja-placeholder",
              "storage_bucket": "dorja-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.dorja.app"
                  }
                },
                "api_key": [{ "current_key": "placeholder" }],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          GSEOF

      - name: Create .env from example
        run: cp .env.example .env || true

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run availability time-math tests
        # Filtered to the new pure-JVM suite: gated release, no flaky
        # legacy/screenshot tests in the path.
        run: ./gradlew testDebugUnitTest --tests "com.example.FormattersTimeTest"

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorja-debug-apks
          path: app/build/outputs/apk/debug/app-*-debug.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: app/build/outputs/apk/debug/app-*-debug.apk
          body: |
            Latest development build from main.

            Per-ABI APKs (keep installs small):
            - app-arm64-v8a-debug.apk — modern phones (install this one)
            - app-armeabi-v7a-debug.apk — older 32-bit phones

            Install on any Android device running Android 7.0+.
          make_latest: true
